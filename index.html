<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Rhythm Jumper</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            display: block;
        }
        #overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }
        button {
            pointer-events: auto;
            padding: 15px 30px;
            font-size: 22px;
            font-weight: bold;
            background: #ff00ff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 20px #ff00ff;
            transition: transform 0.1s;
        }
        button:active {
            transform: scale(0.95);
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 30px;
            text-shadow: 0 0 15px #00ffff, 0 0 30px #ff00ff;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="overlay">
        <h1>Neon Rhythm Jumper</h1>
        <button id="startBtn">START (Włącz Dźwięk)</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let audioCtx, isPlaying = false;
        let beatInterval = 400; 
        let lastBeat = 0;
        let beatFlash = 0;

        const keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        const player = {
            x: 100, y: 200, width: 30, height: 30,
            vx: 0, vy: 0, speed: 6, jumpPower: -16,
            grounded: false, color: '#00ffff'
        };

        const platforms = [
            {x: 0, y: canvas.height - 50, w: canvas.width, h: 50, color: '#ff00ff'},
            {x: 300, y: canvas.height - 180, w: 120, h: 20, color: '#00ff00'},
            {x: 550, y: canvas.height - 280, w: 120, h: 20, color: '#ffff00'},
            {x: 800, y: canvas.height - 380, w: 120, h: 20, color: '#ff0000'},
            {x: 1050, y: canvas.height - 220, w: 120, h: 20, color: '#ff00ff'},
            {x: 100, y: canvas.height - 350, w: 100, h: 20, color: '#ff9900'}
        ];

        function playSynthKick() {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.15);
            
            gain.gain.setValueAtTime(1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        document.getElementById('startBtn').addEventListener('click', () => {
            document.getElementById('overlay').style.display = 'none';
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            isPlaying = true;
            lastBeat = performance.now();
            gameLoop(performance.now());
        });

        function update(time) {
            if (isPlaying && time - lastBeat > beatInterval) {
                playSynthKick();
                lastBeat = time;
                beatFlash = 1.0; 
            }
            if (beatFlash > 0) beatFlash -= 0.04;

            player.vy += 0.8; 
            player.x += player.vx;
            player.y += player.vy;

            if (keys['ArrowLeft'] || keys['KeyA']) player.vx = -player.speed;
            else if (keys['ArrowRight'] || keys['KeyD']) player.vx = player.speed;
            else player.vx *= 0.8; 

            if ((keys['ArrowUp'] || keys['KeyW'] || keys['Space']) && player.grounded) {
                player.vy = player.jumpPower;
                player.grounded = false;
            }

            player.grounded = false;

            for (let p of platforms) {
                if (player.x < p.x + p.w && player.x + player.width > p.x &&
                    player.y < p.y + p.h && player.y + player.height > p.y) {
                    
                    if (player.vy > 0 && player.y + player.height - player.vy <= p.y) {
                        player.y = p.y - player.height;
                        player.vy = 0;
                        player.grounded = true;
                    }
                }
            }

            if (player.x > canvas.width) player.x = -player.width;
            if (player.x + player.width < 0) player.x = canvas.width;
            if (player.y > canvas.height) {
                player.x = 100;
                player.y = 200;
                player.vy = 0;
            }
        }

        function draw() {
            const bgVal = Math.floor(17 + beatFlash * 30);
            ctx.fillStyle = `rgb(${bgVal}, ${bgVal}, ${bgVal})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let p of platforms) {
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 10 + beatFlash * 25;
                ctx.shadowColor = p.color;
                ctx.fillRect(p.x, p.y, p.w, p.h);
            }

            ctx.fillStyle = player.color;
            ctx.shadowBlur = 15 + beatFlash * 15;
            ctx.shadowColor = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.shadowBlur = 0; 
        }

        function gameLoop(time) {
            update(time);
            draw();
            requestAnimationFrame(gameLoop);
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            platforms[0].w = canvas.width;
            platforms[0].y = canvas.height - 50;
        });
    </script>
</body>
</html>
