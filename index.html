<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Rhythm Jumper - Aleks Edition</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #7ac5e8; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
            user-select: none;
        }
        canvas {
            display: block;
        }
        #scoreDisplay {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: #00ffff;
            font-size: 28px;
            font-weight: bold;
            z-index: 15;
            text-shadow: 0 0 15px #000000, 0 0 5px #000000;
            pointer-events: none;
        }
        
        .controls-container {
            position: absolute;
            bottom: 20px;
            z-index: 10;
            display: flex;
            gap: 10px;
        }
        #controls-left {
            left: 10px;
        }
        #controls-right {
            right: 20px;
        }
        .control-btn {
            width: 75px;
            height: 75px;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid #00ffff;
            color: #00ffff;
            font-size: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
            -webkit-tap-highlight-color: transparent;
        }
        .control-btn:active {
            background: rgba(0, 255, 255, 0.4);
            box-shadow: 0 0 25px #00ffff;
            transform: scale(0.95);
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            color: #00ffff;
            text-align: center;
        }
        .overlay h1 {
            text-shadow: 0 0 15px #00ffff;
            margin-bottom: 20px;
            font-size: 40px;
            margin-top: 0;
        }
        .overlay p {
            font-size: 24px; margin-bottom: 20px;
        }
        .overlay input {
            padding: 10px; font-size: 20px; border: 2px solid #00ffff;
            background: rgba(0,0,0,0.5); color: #fff; border-radius: 5px; 
            text-align: center; margin-bottom: 20px; outline: none;
            user-select: auto;
        }
        .overlay button {
            padding: 10px 30px; font-size: 24px; border: 2px solid #00ffff;
            background: rgba(0, 255, 255, 0.1); color: #00ffff;
            border-radius: 10px; cursor: pointer; text-shadow: 0 0 10px #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3); transition: 0.2s;
            margin-top: 10px;
        }
        .overlay button:active {
            transform: scale(0.95); background: rgba(0, 255, 255, 0.4);
        }
        #leaderboardList {
            list-style: none; padding: 0; font-size: 22px; text-align: left;
            margin-bottom: 30px; line-height: 1.5; width: 320px; max-height: 50vh; overflow-y: auto;
        }
        #leaderboardList li {
            display: flex; justify-content: space-between;
            border-bottom: 1px solid rgba(0, 255, 255, 0.3); padding: 8px 0;
        }
    </style>
</head>
<body>
    <div id="scoreDisplay">Punkty: 0</div>
    <canvas id="gameCanvas"></canvas>

    <div id="controls-left" class="controls-container">
        <div class="control-btn" id="btnLeft">◄</div>
        <div class="control-btn" id="btnRight">►</div>
    </div>
    <div id="controls-right" class="controls-container">
        <div class="control-btn" id="btnJump">▲</div>
    </div>

    <div id="gameOverScreen" class="overlay">
        <h1>Koniec Gry!</h1>
        <p>Twój wynik: <span id="finalScore">0</span> pkt</p>
        <input type="text" id="playerName" placeholder="Wpisz swój nick" maxlength="15">
        <button id="btnSubmitScore">Zapisz wynik</button>
    </div>

    <div id="leaderboardScreen" class="overlay">
        <h1>Top 10 Graczy</h1>
        <ul id="leaderboardList"></ul>
        <button id="btnRestart">Zagraj ponownie</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const playerImg = new Image();
        playerImg.src = 'Aleks.jpg'; 
        playerImg.onerror = () => {
            console.error("BRAK OBRAZKA: Upewnij się, że plik Aleks.jpg znajduje się w tym samym folderze, co Twój plik z grą!");
        };
        
        let audioCtx;
        let beatInterval = 500; // Wolniejsze, przyjemniejsze tempo
        let beatStep = 0;
        let lastBeat = 0;
        let beatFlash = 0;
        let cameraX = 0;
        
        let distanceScore = 0;
        let boneScore = 0;
        let score = 0;
        let maxPlayerX = 100;
        const scoreDisplay = document.getElementById('scoreDisplay');
        const keys = {};

        // Flaga dla podwójnego skoku
        let jumpKeyWasDown = false;

        let frame = 0;
        let animCounter = 0;
        let lastDir = 'right';

        let gameState = 'playing'; 
        let topScores = JSON.parse(localStorage.getItem('neonJumperTopScores')) || [];

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                lastBeat = performance.now();
                playChillBeat();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        window.addEventListener('keydown', e => { 
            if(gameState === 'playing') { initAudio(); keys[e.code] = true; }
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        function bindControl(btnId, keyName) {
            const btn = document.getElementById(btnId);
            const press = (e) => { e.preventDefault(); if(gameState === 'playing'){ initAudio(); keys[keyName] = true; }};
            const release = (e) => { e.preventDefault(); keys[keyName] = false; };
            
            btn.addEventListener('touchstart', press, {passive: false});
            btn.addEventListener('touchend', release, {passive: false});
            btn.addEventListener('mousedown', press);
            btn.addEventListener('mouseup', release);
            btn.addEventListener('mouseleave', release);
        }

        bindControl('btnLeft', 'ArrowLeft');
        bindControl('btnRight', 'ArrowRight');
        bindControl('btnJump', 'ArrowUp');

        const player = {
            x: 100, y: 200, width: 60, height: 60,
            vx: 0, vy: 0, speed: 7, jumpPower: -15,
            grounded: false, jumps: 0 // Zmienna do liczenia skoków
        };

        let platforms = [];
        let bones = [];

        function generateMap() {
            const ch = canvas.height - 120; 
            platforms = [
                {x: 0, y: ch - 50, w: 1000, h: 50, color: '#ff00ff'},
                {x: 1200, y: ch - 50, w: 800, h: 50, color: '#00ffff'},
                {x: 2300, y: ch - 50, w: 1500, h: 50, color: '#ff00ff'},
                {x: 4100, y: ch - 50, w: 2000, h: 50, color: '#00ffff'},

                {x: 350, y: ch - 180, w: 120, h: 20, color: '#00ff00'},
                {x: 600, y: ch - 300, w: 120, h: 20, color: '#ffff00'},
                {x: 850, y: ch - 420, w: 120, h: 20, color: '#ff0000'},
                
                {x: 1300, y: ch - 200, w: 100, h: 20, color: '#ff9900'},
                {x: 1550, y: ch - 320, w: 100, h: 20, color: '#ff00ff'},
                {x: 1800, y: ch - 220, w: 100, h: 20, color: '#00ff00'},
                
                {x: 2500, y: ch - 150, w: 150, h: 20, color: '#ff0000'},
                {x: 2800, y: ch - 280, w: 150, h: 20, color: '#ffff00'},
                {x: 3100, y: ch - 400, w: 150, h: 20, color: '#ff00ff'},
                {x: 3450, y: ch - 250, w: 100, h: 20, color: '#00ffff'},
                {x: 3750, y: ch - 380, w: 100, h: 20, color: '#ff9900'}
            ];

            bones = [];
            for (let i = 1; i < platforms.length; i++) {
                let p = platforms[i];
                if (Math.random() > 0.3) { 
                    let count = Math.floor(Math.random() * 3) + 1; 
                    for (let j = 0; j < count; j++) {
                        let bx = p.x + 20 + Math.random() * (p.w - 50);
                        let by = p.y - 40 - Math.random() * 60; 
                        bones.push({x: bx, y: by, w: 30, h: 20, collected: false});
                    }
                }
            }
        }
        generateMap();

        function playChillBeat() {
            if(!audioCtx) return;
            const t = audioCtx.currentTime;

            // Przyjemne, rozmyte akordy (lo-fi vibe)
            const chords = [
                [261.63, 329.63, 392.00], // C major
                [220.00, 261.63, 329.63], // A minor
                [174.61, 220.00, 261.63], // F major
                [196.00, 246.94, 293.66]  // G major
            ];
            
            const currentChord = chords[Math.floor(beatStep / 4) % chords.length];

            // Graj akord co 4 uderzenia (na początku taktu)
            if (beatStep % 4 === 0) {
                currentChord.forEach(freq => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, t);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    
                    gain.gain.setValueAtTime(0, t);
                    gain.gain.linearRampToValueAtTime(0.1, t + 0.5); // Miękkie wejście
                    gain.gain.linearRampToValueAtTime(0, t + 2.0);   // Długie, spokojne wybrzmienie
                    
                    osc.start(t);
                    osc.stop(t + 2.0);
                });
            }

            // Miękka perkusja
            if (beatStep % 2 === 0) {
                // Kick (stopa)
                const kick = audioCtx.createOscillator();
                const kickGain = audioCtx.createGain();
                kick.connect(kickGain);
                kickGain.connect(audioCtx.destination);
                kick.frequency.setValueAtTime(100, t);
                kick.frequency.exponentialRampToValueAtTime(0.01, t + 0.2);
                kickGain.gain.setValueAtTime(0.4, t);
                kickGain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
                kick.start(t);
                kick.stop(t + 0.2);
            } else {
                // Miękki Hi-hat
                const hat = audioCtx.createOscillator();
                const hatGain = audioCtx.createGain();
                const hatFilter = audioCtx.createBiquadFilter();
                hat.type = 'square';
                hat.frequency.setValueAtTime(800, t);
                hatFilter.type = 'bandpass';
                hatFilter.frequency.value = 3000;
                hat.connect(hatFilter);
                hatFilter.connect(hatGain);
                hatGain.connect(audioCtx.destination);
                hatGain.gain.setValueAtTime(0.05, t);
                hatGain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
                hat.start(t);
                hat.stop(t + 0.1);
            }

            // Spokojna melodyjka
            const melSeq = [392.00, 523.25, 659.25, 523.25];
            const melFreq = melSeq[beatStep % melSeq.length];
            const melOsc = audioCtx.createOscillator();
            const melGain = audioCtx.createGain();
            melOsc.type = 'triangle';
            melOsc.frequency.setValueAtTime(melFreq, t);
            melOsc.connect(melGain);
            melGain.connect(audioCtx.destination);
            melGain.gain.setValueAtTime(0.05, t);
            melGain.gain.linearRampToValueAtTime(0, t + 0.3);
            melOsc.start(t);
            melOsc.stop(t + 0.3);

            beatStep++;
        }

        function playBoneSound() {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }
        
        function playJumpSound() {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
            
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function updateScore() {
            score = distanceScore + boneScore;
            scoreDisplay.innerText = `Punkty: ${score}`;
        }

        document.getElementById('btnSubmitScore').addEventListener('click', () => {
            const nameInput = document.getElementById('playerName').value.trim();
            const playerName = nameInput === '' ? 'Anonim' : nameInput;
            
            topScores.push({ name: playerName, score: score });
            topScores.sort((a, b) => b.score - a.score);
            topScores = topScores.slice(0, 10);
            localStorage.setItem('neonJumperTopScores', JSON.stringify(topScores));
            
            document.getElementById('gameOverScreen').style.display = 'none';
            document.getElementById('leaderboardScreen').style.display = 'flex';
            
            const list = document.getElementById('leaderboardList');
            list.innerHTML = '';
            topScores.forEach((entry, idx) => {
                list.innerHTML += `<li><span>${idx + 1}. ${entry.name}</span> <span>${entry.score} pkt</span></li>`;
            });
        });

        document.getElementById('btnRestart').addEventListener('click', () => {
            document.getElementById('leaderboardScreen').style.display = 'none';
            player.x = 100;
            player.y = 200;
            player.vy = 0;
            player.vx = 0;
            player.jumps = 0;
            maxPlayerX = 100; 
            distanceScore = 0;
            boneScore = 0;
            jumpKeyWasDown = false;
            
            generateMap(); 
            updateScore();
            
            gameState = 'playing';
            
            for(let k in keys) keys[k] = false;
        });

        function update(time) {
            if (audioCtx && time - lastBeat > beatInterval) {
                playChillBeat();
                lastBeat = time;
                beatFlash = (beatStep % 4 === 1) ? 0.5 : 0.1; // Błyska lekko w rytm akordów
            }
            if (beatFlash > 0) beatFlash -= 0.01;

            player.vy += 0.8; // Grawitacja
            player.x += player.vx;
            player.y += player.vy;

            // Ruch poziomy
            if (keys['ArrowLeft'] || keys['KeyA']) {
                player.vx = -player.speed;
                lastDir = 'left';
            } else if (keys['ArrowRight'] || keys['KeyD']) {
                player.vx = player.speed;
                lastDir = 'right';
            } else {
                player.vx *= 0.8; 
            }

            // Obsługa skoku z mechaniką DOUBLE JUMP
            let isJumpDown = keys['ArrowUp'] || keys['KeyW'] || keys['Space'];
            
            if (isJumpDown && !jumpKeyWasDown) {
                if (player.grounded) {
                    player.vy = player.jumpPower;
                    player.grounded = false;
                    player.jumps = 1;
                    playJumpSound();
                } else if (player.jumps < 2) { // Podwójny skok w powietrzu
                    player.vy = player.jumpPower * 0.9; // Drugi skok odrobinę słabszy
                    player.jumps = 2;
                    playJumpSound();
                }
            }
            jumpKeyWasDown = isJumpDown; // Zapobiega ciągłemu skakaniu przy przytrzymaniu przycisku

            player.grounded = false;

            // Kolizje z platformami
            for (let p of platforms) {
                if (player.x < p.x + p.w && player.x + player.width > p.x &&
                    player.y < p.y + p.h && player.y + player.height > p.y) {
                    
                    if (player.vy > 0 && player.y + player.height - player.vy <= p.y) {
                        player.y = p.y - player.height;
                        player.vy = 0;
                        player.grounded = true;
                        player.jumps = 0; // Resetujemy skoki po dotknięciu ziemi
                    }
                }
            }

            for (let b of bones) {
                if (!b.collected) {
                    if (player.x < b.x + b.w && player.x + player.width > b.x &&
                        player.y < b.y + b.h && player.y + player.height > b.y) {
                        b.collected = true;
                        boneScore += 20; 
                        playBoneSound();
                        updateScore();
                    }
                }
            }

            if (player.x < 0) player.x = 0;

            if (player.x > maxPlayerX) {
                maxPlayerX = player.x;
                distanceScore = Math.floor((maxPlayerX - 100) / 50);
                updateScore();
            }

            if (player.y > canvas.height + 100) {
                gameState = 'gameover';
                document.getElementById('finalScore').innerText = score;
                document.getElementById('gameOverScreen').style.display = 'flex';
                document.getElementById('playerName').value = '';
                document.getElementById('playerName').focus();
            }

            cameraX = player.x - canvas.width / 3;
            if (cameraX < 0) cameraX = 0;

            if (player.grounded) {
                animCounter++;
                if (Math.abs(player.vx) > 0.5) {
                    if (animCounter > 5) { 
                        frame = (frame + 1) % 4;
                        animCounter = 0;
                    }
                } else {
                    if (animCounter > 15) { 
                        frame = (frame + 1) % 4;
                        animCounter = 0;
                    }
                }
            } else {
                frame = 1; 
            }
        }

        function draw() {
            ctx.fillStyle = '#7ac5e8';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(-cameraX, 0);

            for (let p of platforms) {
                if (p.x + p.w > cameraX && p.x < cameraX + canvas.width) {
                    ctx.fillStyle = p.color;
                    ctx.shadowBlur = 5 + beatFlash * 15;
                    ctx.shadowColor = p.color;
                    ctx.fillRect(p.x, p.y, p.w, p.h);
                }
            }

            ctx.shadowBlur = 5;
            ctx.shadowColor = '#ffffff';
            ctx.fillStyle = '#ffffff';
            for (let b of bones) {
                if (!b.collected && b.x + b.w > cameraX && b.x < cameraX + canvas.width) {
                    ctx.beginPath();
                    ctx.arc(b.x + 6, b.y + 6, 6, 0, Math.PI * 2);
                    ctx.arc(b.x + 6, b.y + 14, 6, 0, Math.PI * 2);
                    ctx.arc(b.x + 24, b.y + 6, 6, 0, Math.PI * 2);
                    ctx.arc(b.x + 24, b.y + 14, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillRect(b.x + 6, b.y + 4, 18, 12);
                }
            }

            ctx.save();
            ctx.translate(player.x + player.width / 2, player.y + player.height / 2);
            
            if (lastDir === 'left') {
                ctx.scale(-1, 1);
            }

            ctx.shadowBlur = 0;
            ctx.shadowColor = 'transparent';

            if (playerImg.complete && playerImg.width > 0) {
                const frameW = playerImg.width / 4;
                const frameH = playerImg.height / 3;
                let row = 0;
                
                if (!player.grounded) {
                    row = 2; 
                } else if (Math.abs(player.vx) > 0.5) {
                    row = 1; 
                } else {
                    row = 0; 
                }

                // NAPRAWA LEWITACJI: Obniżenie punktu rysowania obrazka o 12 pikseli, 
                // żeby zniwelować puste miejsce na dole klatki animacji
                const Y_OFFSET = 12;

                ctx.drawImage(
                    playerImg,
                    frame * frameW, row * frameH, frameW, frameH,
                    -player.width / 2, -player.height / 2 + Y_OFFSET, player.width, player.height
                );
            } else {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(-player.width / 2, -player.height / 2, player.width, player.height);
            }
            ctx.restore(); 
            
            ctx.restore(); 
        }

        function gameLoop(time) {
            if (gameState === 'playing') {
                update(time);
            }
            draw();
            requestAnimationFrame(gameLoop);
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            if (gameState === 'playing') {
                generateMap(); 
            }
        });

        gameLoop(performance.now());
    </script>
</body>
</html>
